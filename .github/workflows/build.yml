name: "Build new artifacts"

on:
  pull_request:
    branches:
      - "main"
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: 294354037686.dkr.ecr.ap-northeast-1.amazonaws.com
  IMAGE: blockchain-avax-x
  DOCKERFILE: Dockerfile
  AWS_REGION: ap-northeast-1
  # Public ECR lives in a separate registry and is only reachable through the
  # us-east-1 endpoint, regardless of where the image is consumed.
  PUBLIC_REGISTRY: public.ecr.aws/b2h7a5c4/chaintable
  PUBLIC_IMAGE: avax-writer
  PUBLIC_AWS_REGION: us-east-1

jobs:
  build-artifacts:
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: [self-hosted, "${{ matrix.arch }}"]
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout avalanchego-x
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: tibdex/github-app-token@v1
        id: generate-token
        with:
          app_id: ${{ secrets.RELEASE_MANAGER_APP_ID }}
          private_key: ${{ secrets.RELEASE_MANAGER_APP_SECRET }}

      - name: Set env
        run: |
          # Prefer the release tag as the image tag when the workflow was
          # triggered by `git push <tag>`; otherwise fall back to the short
          # commit hash.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            IMAGE_TAG="${GITHUB_REF_NAME}"
          else
            IMAGE_TAG="$(git rev-parse --short=9 HEAD)"
          fi
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV
          echo "GO_VERSION=$(awk '/^go / {print $2; exit}' go.mod)" >> $GITHUB_ENV

      # Private ECR uses the self-hosted runner's instance role.
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Public ECR is a different account/registry, so it needs its own OIDC
      # role. This overwrites the AWS_* env vars set above, but the private
      # registry's docker credentials are already persisted by the login step.
      - name: Configure AWS Credentials (public ECR, OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.PUBLIC_AWS_REGION }}

      - name: Login to Amazon ECR Public
        id: login-ecr-public
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      # ECR Public does not create repositories on push. Idempotent: the second
      # matrix job (and every later run) just hits RepositoryAlreadyExists.
      - name: Ensure public ECR repository exists
        continue-on-error: true
        run: |
          aws ecr-public create-repository \
            --region ${PUBLIC_AWS_REGION} \
            --repository-name ${PUBLIC_IMAGE} \
            || echo "repository ${PUBLIC_IMAGE} already exists (or cannot be created by this role)"

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          file: ${{ env.DOCKERFILE }}
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ matrix.arch }}-${{ env.IMAGE_TAG }}
            ${{ env.PUBLIC_REGISTRY }}/${{ env.PUBLIC_IMAGE }}:${{ matrix.arch }}-${{ env.IMAGE_TAG }}
          build-args: |
            ACCESS_TOKEN=${{ steps.generate-token.outputs.token }}
            GO_VERSION=${{ env.GO_VERSION }}
          provenance: false

  merge-docker-manifest:
    runs-on: [self-hosted, general]
    needs: build-artifacts
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout avalanchego-x
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set env
        run: |
          # Must match the tag computed by build-artifacts.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            IMAGE_TAG="${GITHUB_REF_NAME}"
          else
            IMAGE_TAG="$(git rev-parse --short=9 HEAD)"
          fi
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Configure AWS Credentials (public ECR, OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.PUBLIC_AWS_REGION }}

      - name: Login to Amazon ECR Public
        id: login-ecr-public
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Merge manifest
        run: |
          # Registry-side manifest lists; the per-arch tags stay published so a
          # specific arch can still be pulled explicitly.
          for repo in "${REGISTRY}/${IMAGE}" "${PUBLIC_REGISTRY}/${PUBLIC_IMAGE}"; do
            docker buildx imagetools create \
              --tag "${repo}:${IMAGE_TAG}" \
              "${repo}:amd64-${IMAGE_TAG}" \
              "${repo}:arm64-${IMAGE_TAG}"
            docker buildx imagetools inspect "${repo}:${IMAGE_TAG}"
          done

      - name: Lark Notification
        continue-on-error: true
        run: |
          if command -v notiv3 >/dev/null 2>&1; then
            notiv3 "Blockchain avax latest image pushed 🎉" \
              "${REGISTRY}/${IMAGE}:${IMAGE_TAG} | ${PUBLIC_REGISTRY}/${PUBLIC_IMAGE}:${IMAGE_TAG}"
          else
            echo "notiv3 not installed on this runner; skipping Lark notification"
          fi
